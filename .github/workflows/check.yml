name: Check for fines

# One job stays running for ~5h45m, checking every few minutes
# (see docs/config.json). Each job queues its own successor as soon as
# it starts, so a new one takes over the moment it ends - 24/7, with no
# computer needed. The schedule is only a backup in case the chain breaks.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: fine-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Queue the next run (keeps the 24/7 chain going)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref main --repo "$GITHUB_REPOSITORY" || echo "could not queue next run; the schedule will retry"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watch FSM and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOOP_MINUTES: "345"
          GIT_PUSH: "1"
        run: |
          git config user.name "fine-watch-bot"
          git config user.email "fine-watch-bot@users.noreply.github.com"
          python checker/check.py

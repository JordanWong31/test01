name: Check for fines

# One job stays running for ~5h45m, checking every few minutes
# (see docs/config.json). The schedule below only makes sure a new
# job is always queued to take over when the current one ends.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fine-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watch FSM and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOOP_MINUTES: "345"
          GIT_PUSH: "1"
        run: |
          git config user.name "fine-watch-bot"
          git config user.email "fine-watch-bot@users.noreply.github.com"
          python checker/check.py

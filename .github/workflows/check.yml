name: Check for fines

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay a few minutes)
  workflow_dispatch: {}       # "Check now" button on the dashboard
  push:
    paths: ["docs/config.json"]  # re-check right after you change the plate

permissions:
  contents: write

concurrency:
  group: fine-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check FSM and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python checker/check.py

      - name: Save status for the dashboard
        run: |
          git config user.name "fine-watch-bot"
          git config user.email "fine-watch-bot@users.noreply.github.com"
          git add docs/status.json
          git diff --cached --quiet && exit 0
          git commit -m "Status update $(date -u +%FT%TZ)" -q
          git pull --rebase -q && git push -q
